<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="lb5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>
  </defs>
  <rect width="900" height="650" fill="url(#lb5Bg)" />
  <rect x="25" y="25" width="850" height="600" fill="none" stroke="#DDD6FE" stroke-width="1" />

  <!-- Contemporary Flat Lay Scene: Studio Table with Folded Garments -->
  <g transform="translate(450, 320)">
    <!-- Studio Table Surface -->
    <rect x="-380" y="-150" width="760" height="300" fill="#EDE9FE" rx="8" />

    <!-- Folded Tee — Left (Lavender) -->
    <rect x="-300" y="-100" width="160" height="200" fill="#C4B5FD" stroke="#A78BFA" stroke-width="1.5" rx="4" />
    <line x1="-300" y1="-40" x2="-140" y2="-40" stroke="#EDE9FE" stroke-width="2" />
    <line x1="-300" y1="40" x2="-140" y2="40" stroke="#EDE9FE" stroke-width="2" />

    <!-- Folded Shirt — Center (White with purple buttons) -->
    <rect x="-60" y="-115" width="120" height="220" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" rx="4" />
    <line x1="-60" y1="-50" x2="60" y2="-50" stroke="#F5F3FF" stroke-width="1.5" />
    <circle cx="0" cy="-70" r="3.5" fill="#7C3AED" />
    <circle cx="0" cy="-30" r="3.5" fill="#7C3AED" />
    <circle cx="0" cy="10" r="3.5" fill="#7C3AED" />

    <!-- Folded Denim — Right (Indigo with purple ID) -->
    <rect x="155" y="-90" width="185" height="190" fill="#1E3A5F" stroke="#312E81" stroke-width="1.5" rx="4" />
    <rect x="155" y="100" width="185" height="20" fill="#DDD6FE" />
    <line x1="165" y1="100" x2="165" y2="120" stroke="#7C3AED" stroke-width="2" />

    <!-- Soft shadow under items -->
    <ellipse cx="-220" cy="120" rx="80" ry="10" fill="#C4B5FD" fill-opacity="0.4" />
    <ellipse cx="0" cy="130" rx="60" ry="8" fill="#C4B5FD" fill-opacity="0.4" />
    <ellipse cx="250" cy="120" rx="95" ry="10" fill="#C4B5FD" fill-opacity="0.4" />
  </g>

  <text x="50" y="600" font-family="'Playfair Display', Georgia, serif" font-size="20" fill="#4C1D95" letter-spacing="3">WARDROBE ESSENTIALS, LAID FLAT</text>
  <text x="50" y="625" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#7C3AED" letter-spacing="2">ARCHIVE LOOK 05 • ORGANIC COTTON &amp; JAPANESE DENIM</text>
</svg>
