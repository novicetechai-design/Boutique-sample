<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="catBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="teeLav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#catBg2)"/>

  <!-- Boxy Tee in lavender on purple BG -->
  <g transform="translate(300, 380)">
    <!-- Body — wide boxy cut -->
    <path d="M-165 -155 L-68 -192 L68 -192 L165 -155 L155 220 L-155 220 Z" fill="url(#teeLav)"/>
    <!-- Ribbed crewneck -->
    <path d="M-68 -192 Q0 -150 68 -192 Q0 -170 -68 -192 Z" fill="#C4B5FD" stroke="#B5A8F8" stroke-width="1"/>
    <!-- Hem rib -->
    <rect x="-155" y="206" width="310" height="18" fill="#C4B5FD" rx="3"/>
    <!-- Dropped shoulder seam -->
    <line x1="-165" y1="-155" x2="-155" y2="200" stroke="#C4B5FD" stroke-width="2" opacity="0.6"/>
    <line x1="165" y1="-155" x2="155" y2="200" stroke="#C4B5FD" stroke-width="2" opacity="0.6"/>
    <!-- Sleeves ribbed hem -->
    <rect x="-228" y="-8" width="55" height="16" fill="#C4B5FD" rx="3"/>
    <rect x="173" y="-8" width="55" height="16" fill="#C4B5FD" rx="3"/>
    <!-- Sleeves -->
    <path d="M-165 -155 L-235 -25 L-180 5 L-148 -75 Z" fill="url(#teeLav)"/>
    <path d="M165 -155 L235 -25 L180 5 L148 -75 Z" fill="url(#teeLav)"/>
    <!-- Graphic / chest print block — subtle purple -->
    <rect x="-45" y="-80" width="90" height="55" fill="none" stroke="#A78BFA" stroke-width="1.5" rx="4" opacity="0.7"/>
    <text x="0" y="-44" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#7C3AED" text-anchor="middle" letter-spacing="2" opacity="0.8">AURA</text>
  </g>

  <text x="50%" y="88%" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">T-SHIRTS</text>
  <text x="50%" y="93%" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(196,181,253,0.9)" text-anchor="middle" letter-spacing="3">BOXY · OVERSIZED · SLIM</text>
</svg>
