<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pBg)"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#EAE5DB" stroke-width="1"/>

  <!-- Relaxed Poplin Overshirt (Chalk White) -->
  <g transform="translate(300, 360)">
    <!-- Main Body -->
    <path d="M-115 -160 L-50 -180 L50 -180 L115 -160 L165 -10 L125 5 L105 -85 L105 190 L-105 190 L-105 -85 L-125 5 L-165 -10 Z" fill="#FFFFFF" stroke="#DCD6CA" stroke-width="1.5"/>
    
    <!-- Collar -->
    <path d="M-50 -180 L0 -125 L50 -180 L35 -195 L-35 -195 Z" fill="#F4F0E8" stroke="#BCB4A6" stroke-width="1.5"/>
    
    <!-- Placket & Buttons -->
    <line x1="0" y1="-125" x2="0" y2="190" stroke="#DCD6CA" stroke-width="1.5"/>
    <circle cx="0" cy="-80" r="3.5" fill="#6E665E"/>
    <circle cx="0" cy="-25" r="3.5" fill="#6E665E"/>
    <circle cx="0" cy="30" r="3.5" fill="#6E665E"/>
    <circle cx="0" cy="85" r="3.5" fill="#6E665E"/>
    <circle cx="0" cy="140" r="3.5" fill="#6E665E"/>

    <!-- Patch Pocket -->
    <rect x="-70" y="-70" width="45" height="55" fill="none" stroke="#DCD6CA" stroke-width="1.2" rx="2"/>
  </g>

  <!-- Clean Editorial Product Label -->
  <text x="300" y="710" font-family="'Playfair Display', serif" font-size="18" font-weight="600" fill="#181716" text-anchor="middle">Relaxed Poplin Overshirt</text>
  <text x="300" y="732" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#6E665E" text-anchor="middle" letter-spacing="2">100% ORGANIC COTTON POPLIN • $95</text>
</svg>
