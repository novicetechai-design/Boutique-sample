<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pBg)"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#EAE5DB" stroke-width="1"/>

  <!-- Washed Linen Wrap Midi Dress (Natural Oatmeal) -->
  <g transform="translate(300, 360)">
    <!-- Bodice -->
    <path d="M-80 -160 L-30 0 L30 0 L80 -160 L30 -160 L0 -80 L-30 -160 Z" fill="#E8E2D7" stroke="#BCB4A6" stroke-width="1.5"/>
    <path d="M-60 -160 L40 0 L-20 0 Z" fill="#F0ECE4" stroke="#BCB4A6" stroke-width="1.5"/>

    <!-- Tie Belt -->
    <rect x="-60" y="-8" width="120" height="16" rx="2" fill="#2C2A29"/>
    <path d="M10 0 L25 120 L5 120 L-5 0 Z" fill="#2C2A29"/>

    <!-- Flowing Midi Skirt -->
    <path d="M-50 8 L50 8 L130 290 L-130 290 Z" fill="#E8E2D7" stroke="#BCB4A6" stroke-width="1.5"/>
    <line x1="-30" y1="10" x2="-60" y2="285" stroke="#DCD6CA" stroke-width="1.5"/>
    <line x1="20" y1="10" x2="45" y2="285" stroke="#DCD6CA" stroke-width="1.5"/>
  </g>

  <!-- Clean Editorial Product Label -->
  <text x="300" y="710" font-family="'Playfair Display', serif" font-size="18" font-weight="600" fill="#181716" text-anchor="middle">Washed Linen Wrap Midi Dress</text>
  <text x="300" y="732" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#6E665E" text-anchor="middle" letter-spacing="2">100% EUROPEAN FLAX LINEN • $145</text>
