<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <!-- Background: white with lavender tint -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="50%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#F8F5FF"/>
    </linearGradient>

    <!-- Figure gradient: charcoal/deep -->
    <linearGradient id="figDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Shirt: bright white -->
    <linearGradient id="shirtWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>

    <!-- Jeans: indigo -->
    <linearGradient id="jeansIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Purple jacket -->
    <linearGradient id="jacketPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Accent dot grid -->
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(167,139,250,0.2)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#heroBg)"/>
  <rect width="900" height="1200" fill="url(#dotGrid)"/>

  <!-- Decorative lavender circle blob -->
  <circle cx="700" cy="250" r="280" fill="#EDE9FE" opacity="0.5"/>
  <circle cx="150" cy="900" r="200" fill="#DDD6FE" opacity="0.3"/>

  <!-- Figure Group — fashion illustration style -->
  <g transform="translate(450, 600)">

    <!-- HEAD -->
    <ellipse cx="0" cy="-370" rx="52" ry="60" fill="#E8D5C4"/>
    <!-- Hair — cropped modern -->
    <path d="M-50 -395 Q-52 -440 0 -445 Q52 -440 50 -395 Q30 -370 0 -368 Q-30 -370 -50 -395 Z" fill="#1C1917"/>
    <!-- Ear -->
    <ellipse cx="-52" cy="-365" rx="8" ry="11" fill="#E8D5C4"/>
    <ellipse cx="52" cy="-365" rx="8" ry="11" fill="#E8D5C4"/>

    <!-- NECK -->
    <rect x="-18" y="-310" width="36" height="35" fill="#E8D5C4"/>

    <!-- PURPLE OVERSIZED JACKET (open) -->
    <!-- Left lapel & body -->
    <path d="M-130 -280 L-65 -280 L-20 -210 L-25 160 L-135 155 Z" fill="url(#jacketPurple)"/>
    <!-- Right lapel & body -->
    <path d="M130 -280 L65 -280 L20 -210 L25 160 L135 155 Z" fill="url(#jacketPurple)"/>
    <!-- Jacket collar lapels -->
    <path d="M-65 -280 L0 -240 L65 -280 L40 -310 L-40 -310 Z" fill="#7C3AED"/>
    <!-- Jacket seam lines -->
    <line x1="-20" y1="-210" x2="-22" y2="155" stroke="#5B21B6" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="-210" x2="22" y2="155" stroke="#5B21B6" stroke-width="1.5" opacity="0.6"/>

    <!-- WHITE SHIRT UNDER JACKET -->
    <path d="M-55 -285 L-15 -210 L0 -200 L15 -210 L55 -285 L25 -295 L-25 -295 Z" fill="url(#shirtWhite)"/>
    <line x1="0" y1="-200" x2="0" y2="140" stroke="#EDE9FE" stroke-width="1.5"/>
    <!-- Shirt buttons -->
    <circle cx="0" cy="-160" r="3" fill="#C4B5FD"/>
    <circle cx="0" cy="-100" r="3" fill="#C4B5FD"/>
    <circle cx="0" cy="-40" r="3" fill="#C4B5FD"/>
    <circle cx="0" cy="20" r="3" fill="#C4B5FD"/>
    <circle cx="0" cy="80" r="3" fill="#C4B5FD"/>

    <!-- LEFT ARM / SLEEVE -->
    <path d="M-130 -280 L-190 -80 L-160 -65 L-115 -230 Z" fill="url(#jacketPurple)"/>
    <!-- RIGHT ARM / SLEEVE -->
    <path d="M130 -280 L190 -80 L160 -65 L115 -230 Z" fill="url(#jacketPurple)"/>

    <!-- RIGHT HAND (slightly posed, holding phone) -->
    <rect x="155" y="-80" width="24" height="42" fill="#E8D5C4" rx="6"/>
    <rect x="162" y="-75" width="10" height="30" fill="#1E1B4B" rx="2"/>

    <!-- INDIGO SLIM JEANS -->
    <path d="M-60 155 L-70 480 L-10 480 L0 220 L10 480 L70 480 L60 155 Z" fill="url(#jeansIndigo)"/>
    <!-- Jeans center crease -->
    <line x1="-35" y1="160" x2="-37" y2="476" stroke="#312E81" stroke-width="1.5" opacity="0.7"/>
    <line x1="35" y1="160" x2="37" y2="476" stroke="#312E81" stroke-width="1.5" opacity="0.7"/>
    <!-- Belt -->
    <rect x="-62" y="153" width="124" height="18" fill="#1C1917" rx="2"/>
    <rect x="-8" y="157" width="16" height="10" fill="#C4B5FD" rx="1"/>

    <!-- WHITE SNEAKERS -->
    <ellipse cx="-38" cy="490" rx="38" ry="18" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.5"/>
    <ellipse cx="38" cy="490" rx="38" ry="18" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.5"/>
    <!-- Shoe sole lines -->
    <line x1="-68" y1="492" x2="-8" y2="492" stroke="#DDD6FE" stroke-width="1"/>
    <line x1="8" y1="492" x2="68" y2="492" stroke="#DDD6FE" stroke-width="1"/>

  </g>

  <!-- Brand label bottom -->
  <text x="70" y="1110" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="600" fill="#4C1D95" letter-spacing="4">AURA STUDIO</text>
  <text x="70" y="1140" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#7C3AED" letter-spacing="3">SPRING / SUMMER 2026</text>

  <!-- Small collection tags top-right -->
  <rect x="680" y="60" width="180" height="32" rx="16" fill="white" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="770" y="81" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="2">NEW ARRIVALS</text>
  <rect x="680" y="108" width="180" height="32" rx="16" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="770" y="129" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#4C1D95" text-anchor="middle" letter-spacing="2">READY TO WEAR</text>
</svg>
