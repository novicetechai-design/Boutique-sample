<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pBg)"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#EAE5DB" stroke-width="1"/>

  <!-- Minimalist Utility Jacket (Raw Canvas) -->
  <g transform="translate(300, 360)">
    <!-- Main Jacket Body -->
    <path d="M-120 -160 L-50 -180 L50 -180 L120 -160 L170 5 L125 20 L105 -75 L105 190 L-105 190 L-105 -75 L-125 20 L-170 5 Z" fill="#DCD6CA" stroke="#BCB4A6" stroke-width="1.5"/>
    
    <!-- Collar -->
    <path d="M-50 -180 L0 -135 L50 -180 L35 -195 L-35 -195 Z" fill="#C8C0B2" stroke="#A89E90" stroke-width="1.5"/>

    <!-- Placket & Horn Buttons -->
    <line x1="0" y1="-135" x2="0" y2="190" stroke="#BCB4A6" stroke-width="2"/>
    <circle cx="0" cy="-90" r="4.5" fill="#181716"/>
    <circle cx="0" cy="-25" r="4.5" fill="#181716"/>
    <circle cx="0" cy="40" r="4.5" fill="#181716"/>
    <circle cx="0" cy="105" r="4.5" fill="#181716"/>
    <circle cx="0" cy="170" r="4.5" fill="#181716"/>

    <!-- Oversized Patch Pockets -->
    <rect x="-85" y="30" width="65" height="75" fill="#D4CCC0" stroke="#BCB4A6" stroke-width="1.2" rx="2"/>
    <rect x="20" y="30" width="65" height="75" fill="#D4CCC0" stroke="#BCB4A6" stroke-width="1.2" rx="2"/>
  </g>

  <!-- Clean Editorial Product Label -->
  <text x="300" y="710" font-family="'Playfair Display', serif" font-size="18" font-weight="600" fill="#181716" text-anchor="middle">Minimalist Utility Jacket</text>
  <text x="300" y="732" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#6E665E" text-anchor="middle" letter-spacing="2">100% HEAVY COTTON TWILL • $175</text>
</svg>
