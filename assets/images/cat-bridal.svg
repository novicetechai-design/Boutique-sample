<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="catBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#catBg4)"/>

  <!-- Jacket category visual -->
  <g transform="translate(300, 360)">
    <!-- Bomber / track jacket hybrid -->
    <path d="M-160 -170 L-75 -205 L75 -205 L160 -170 L148 185 L-148 185 Z" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1.5"/>
    <!-- Collar stand/mock collar -->
    <rect x="-45" y="-213" width="90" height="30" fill="#FAFAFE" stroke="#DDD6FE" stroke-width="1.5" rx="15"/>
    <!-- Zip placket -->
    <line x1="0" y1="-183" x2="0" y2="185" stroke="#DDD6FE" stroke-width="3"/>
    <!-- Zip teeth -->
    <rect x="-5" y="-183" width="10" height="14" fill="#C4B5FD" rx="2"/>
    <!-- Chest welt pockets -->
    <line x1="-120" y1="-60" x2="-55" y2="-60" stroke="#DDD6FE" stroke-width="3"/>
    <line x1="55" y1="-60" x2="120" y2="-60" stroke="#DDD6FE" stroke-width="3"/>
    <!-- Two hand pockets -->
    <line x1="-120" y1="100" x2="-55" y2="100" stroke="#DDD6FE" stroke-width="3"/>
    <line x1="55" y1="100" x2="120" y2="100" stroke="#DDD6FE" stroke-width="3"/>
    <!-- Sleeves -->
    <path d="M-160 -170 L-212 45 L-178 60 L-142 -65 Z" fill="#FAFAFE" stroke="#DDD6FE" stroke-width="1.5"/>
    <path d="M160 -170 L212 45 L178 60 L142 -65 Z" fill="#FAFAFE" stroke="#DDD6FE" stroke-width="1.5"/>
    <!-- Purple contrast cuffs -->
    <rect x="-215" y="30" width="40" height="18" fill="#7C3AED" rx="4"/>
    <rect x="175" y="30" width="40" height="18" fill="#7C3AED" rx="4"/>
    <!-- Purple hem rib -->
    <rect x="-148" y="175" width="296" height="20" fill="#7C3AED" rx="3"/>
    <!-- Purple collar trim -->
    <rect x="-45" y="-213" width="90" height="7" fill="#7C3AED" rx="5"/>
    <!-- Shoulder seam taping -->
    <line x1="-150" y1="-178" x2="-142" y2="-65" stroke="#EDE9FE" stroke-width="2" opacity="0.7"/>
    <line x1="150" y1="-178" x2="142" y2="-65" stroke="#EDE9FE" stroke-width="2" opacity="0.7"/>
  </g>

  <text x="50%" y="88%" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">JACKETS</text>
  <text x="50%" y="93%" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(196,181,253,0.9)" text-anchor="middle" letter-spacing="3">BLAZER · BOMBER · COACHES</text>
</svg>
