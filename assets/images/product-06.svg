<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pBg)"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#EAE5DB" stroke-width="1"/>

  <!-- Ribbed Knit Sleeveless Top (Soft Bone) -->
  <g transform="translate(300, 360)">
    <!-- Main Tank Body -->
    <path d="M-60 -170 L-35 -180 L35 -180 L60 -170 L85 -100 L75 160 L-75 160 L-85 -100 Z" fill="#F4F0E8" stroke="#BCB4A6" stroke-width="1.5"/>
    
    <!-- High Neckline -->
    <path d="M-35 -180 C-35 -165, 35 -165, 35 -180 Z" fill="#EAE5DB" stroke="#BCB4A6" stroke-width="1.2"/>

    <!-- Subtle Fine Ribbed Vertical Lines -->
    <line x1="-50" y1="-140" x2="-50" y2="155" stroke="#EAE5DB" stroke-width="1.5"/>
    <line x1="-30" y1="-155" x2="-30" y2="155" stroke="#EAE5DB" stroke-width="1.5"/>
    <line x1="-10" y1="-160" x2="-10" y2="155" stroke="#EAE5DB" stroke-width="1.5"/>
    <line x1="10" y1="-160" x2="10" y2="155" stroke="#EAE5DB" stroke-width="1.5"/>
    <line x1="30" y1="-155" x2="30" y2="155" stroke="#EAE5DB" stroke-width="1.5"/>
    <line x1="50" y1="-140" x2="50" y2="155" stroke="#EAE5DB" stroke-width="1.5"/>
  </g>

  <!-- Clean Editorial Product Label -->
  <text x="300" y="710" font-family="'Playfair Display', serif" font-size="18" font-weight="600" fill="#181716" text-anchor="middle">Ribbed Knit Sleeveless Top</text>
  <text x="300" y="732" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#6E665E" text-anchor="middle" letter-spacing="2">ORGANIC COTTON &amp; ELASTANE • $55</text>
</svg>
