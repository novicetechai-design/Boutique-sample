<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="catDressBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#catDressBg)"/>
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="#EAE5DB" stroke-width="1"/>

  <!-- Minimalist Hanger Detail -->
  <path d="M260 140 C260 115, 340 115, 340 140 C340 155, 300 160, 300 175" fill="none" stroke="#6E665E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="210" y1="210" x2="390" y2="210" stroke="#6E665E" stroke-width="3" stroke-linecap="round"/>

  <!-- Linen Wrap Midi Dress -->
  <!-- Bodice & V-neck -->
  <path d="M245 210 L285 340 L315 340 L355 210 L315 210 L300 270 L285 210 Z" fill="#E8E2D7" stroke="#BCB4A6" stroke-width="1.5"/>
  <!-- Wrap Overlay -->
  <path d="M260 210 L325 340 L275 340 Z" fill="#F0ECE4" stroke="#BCB4A6" stroke-width="1.5"/>

  <!-- Self-fabric tie waist -->
  <rect x="260" y="335" width="80" height="14" rx="2" fill="#2C2A29"/>
  <path d="M320 345 L335 440 L315 440 L305 345 Z" fill="#2C2A29"/>

  <!-- Draped A-line Midi Skirt -->
  <path d="M265 348 L335 348 L390 620 L210 620 Z" fill="#E8E2D7" stroke="#BCB4A6" stroke-width="1.5"/>
  <!-- Subtle fabric fold lines -->
  <line x1="280" y1="350" x2="260" y2="615" stroke="#DCD6CA" stroke-width="1.5"/>
  <line x1="320" y1="350" x2="340" y2="615" stroke="#DCD6CA" stroke-width="1.5"/>

  <!-- Category Label Text -->
  <text x="300" y="690" font-family="'Playfair Display', serif" font-size="22" font-weight="600" fill="#181716" text-anchor="middle" letter-spacing="2">DRESSES</text>
  <text x="300" y="715" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#6E665E" text-anchor="middle" letter-spacing="3">READY-TO-WEAR • 12 STYLES</text>
</svg>
