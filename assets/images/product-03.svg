<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pBg)"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#EAE5DB" stroke-width="1"/>

  <!-- Heavyweight Boxy Crewneck Tee (Sandstone) -->
  <g transform="translate(300, 360)">
    <!-- Main Body -->
    <path d="M-110 -150 L-45 -165 L45 -165 L110 -150 L155 -40 L110 -25 L100 -80 L100 180 L-100 180 L-100 -80 L-110 -25 L-155 -40 Z" fill="#EAE5DB" stroke="#BCB4A6" stroke-width="1.5"/>
    
    <!-- Ribbed Crewneck Collar -->
    <path d="M-45 -165 C-45 -130, 45 -130, 45 -165 C40 -170, -40 -170, -45 -165 Z" fill="#FAF8F5" stroke="#BCB4A6" stroke-width="1.5"/>

    <!-- Bottom & Sleeve Hem Topstitch Details -->
    <line x1="-100" y1="165" x2="100" y2="165" stroke="#DCD6CA" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="-150" y1="-50" x2="-112" y2="-37" stroke="#DCD6CA" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="112" y1="-37" x2="150" y2="-50" stroke="#DCD6CA" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>

  <!-- Clean Editorial Product Label -->
  <text x="300" y="710" font-family="'Playfair Display', serif" font-size="18" font-weight="600" fill="#181716" text-anchor="middle">Heavyweight Boxy Crewneck Tee</text>
  <text x="300" y="732" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#6E665E" text-anchor="middle" letter-spacing="2">260 GSM COMBED ORGANIC COTTON • $48</text>
</svg>
